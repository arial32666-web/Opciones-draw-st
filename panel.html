<div class="cr" data-cr-root hidden>
  <div class="cr__panel cr__bubble" data-cr-bubble role="dialog" aria-label="Crossroads option">
    <div class="cr__panel-head">
      <span class="cr__panel-icon" data-cr-bubble-icon></span>
      <span class="cr__panel-label" data-cr-bubble-label></span>
      <div class="cr__panel-tools" role="group" aria-label="Option enhancement">
        <button class="cr__head-tool" type="button" data-cr-expand
          aria-label="Expand this option" title="Expand this option">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5M9 9 4 4M15 9l5-5M9 15l-5 5M15 15l5 5"/>
          </svg>
        </button>
        <button class="cr__head-tool" type="button" data-cr-ooc-toggle
          aria-label="Open custom OOC enhancer" aria-expanded="false"
          title="Custom enhance with OOC">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m4 20 10.6-10.6M13.2 5.2l5.6 5.6M16.2 2.8l.5-1.6M20.7 7.3l1.6-.5M19.3 3.7l1.2-1.2M5.3 12.5l-.6-1.6M2.7 15.1l-1.6.6"/>
          </svg>
        </button>
      </div>
      <button class="cr__x" type="button" data-cr-bubble-close aria-label="Close option">&#215;</button>
    </div>
    <div class="cr__enhance-prompt" data-cr-enhance-prompt hidden>
      <label class="cr__enhance-label" for="cr-enhance-ooc">Custom enhancement instruction (OOC)</label>
      <textarea id="cr-enhance-ooc" class="cr__enhance-ooc" data-cr-enhance-ooc
        maxlength="800" rows="2"
        placeholder="Describe the rewrite, e.g. expand this with more tension and sensory detail, or make the dialogue more guarded."></textarea>
      <div class="cr__enhance-actions">
        <p class="cr__hint">The wand follows this instruction. It only expands when you ask it to.</p>
        <button class="cr__enhance-run" type="button" data-cr-enhance disabled>Enhance with OOC</button>
      </div>
    </div>
    <div class="cr__panel-body" data-cr-bubble-body></div>
    <div class="cr__panel-foot">
      <button class="cr__use" type="button" data-cr-use>Use this</button>
      <button class="cr__ghost" type="button" data-cr-bubble-redraw title="Replace only this option">Redraw this</button>
    </div>
  </div>

  <div class="cr__panel cr__theme" data-cr-theme role="dialog" aria-label="Crossroads settings">
    <div class="cr__panel-head">
      <span class="cr__panel-label">Crossroads</span>
      <button class="cr__x" type="button" data-cr-theme-close aria-label="Close settings">&#215;</button>
    </div>
    <div class="cr__tabs" role="tablist" aria-label="Crossroads settings sections">
      <button class="cr__tab is-on" id="cr-tab-tones" type="button" role="tab" aria-selected="true" aria-controls="cr-settings-panel" data-cr-tab="tones">Tones</button>
      <button class="cr__tab" id="cr-tab-instruction" type="button" role="tab" aria-selected="false" aria-controls="cr-settings-panel" data-cr-tab="instruction">Instruction</button>
      <button class="cr__tab" id="cr-tab-settings" type="button" role="tab" aria-selected="false" aria-controls="cr-settings-panel" data-cr-tab="settings">Settings</button>
      <button class="cr__tab" id="cr-tab-appearance" type="button" role="tab" aria-selected="false" aria-controls="cr-settings-panel" data-cr-tab="appearance">Appearance</button>
    </div>
    <div class="cr__panel-body cr__theme-body" id="cr-settings-panel" role="tabpanel" aria-labelledby="cr-tab-tones" data-cr-theme-body></div>
  </div>

  <div class="cr__bar" data-cr-bar>
    <button class="cr__toggle" type="button" data-cr-toggle aria-label="Show or hide options" title="Show or hide options">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button class="cr__draw" type="button" data-cr-draw aria-label="Draw options">
      <span class="cr__draw-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3v6M12 15v6M3 12h6M15 12h6M6.3 6.3l4.2 4.2M13.5 13.5l4.2 4.2M17.7 6.3l-4.2 4.2M10.5 13.5l-4.2 4.2"/></svg>
      </span>
      <span class="cr__draw-text" data-cr-draw-text>Draw</span>
      <span class="cr__draw-badge" data-cr-badge hidden></span>
    </button>
    <div class="cr__slots" data-cr-slots></div>
    <button class="cr__icon-btn cr__pathreview" type="button" data-cr-pathreview hidden
      aria-label="Review paths for this turn" title="Review paths for this turn">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h10M4 12h10M4 18h7"/><path d="M16.5 16.5 20 20"/><circle cx="17" cy="13" r="3.2"/>
      </svg>
    </button>
    <button class="cr__icon-btn" type="button" data-cr-pathmode
      aria-pressed="false" aria-label="Response paths" title="Response paths: off">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 21v-5.5"/><path d="M12 15.5 6 9.5V4"/><path d="M12 15.5V4"/><path d="M12 15.5l6-6V4"/>
      </svg>
    </button>
    <button class="cr__icon-btn" type="button" data-cr-palette aria-label="Crossroads settings" title="Crossroads settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="9.5" r="1.3"/><circle cx="15" cy="9.5" r="1.3"/><circle cx="9.5" cy="15" r="1.3"/></svg>
    </button>
    <div class="cr__sweep" data-cr-sweep hidden></div>
  </div>

  <div class="cr__live" data-cr-live aria-live="polite"></div>
</div>

<dialog class="cr-paths" data-cr-paths aria-label="Choose a response path">
  <div class="cr-paths__head">
    <span class="cr-paths__title" data-cr-paths-title>Where does this go?</span>
    <button class="cr-paths__x" type="button" data-cr-paths-cancel
      aria-label="Send without a response path" title="Send without a response path">&#215;</button>
  </div>
  <div class="cr-paths__body" data-cr-paths-body></div>
  <div class="cr-paths__foot" data-cr-paths-foot></div>
</dialog>

<style>
  .cr {
    --cr-bg: #17171a;
    --cr-surface: #202025;
    --cr-text: #ece9e3;
    --cr-muted: #a4a09a;
    --cr-faint: #6f6c68;
    --cr-accent: #c8a24a;
    --cr-accent-soft: rgba(200, 162, 74, 0.16);
    --cr-hairline: rgba(255, 255, 255, 0.09);
    --cr-fs: 1;
    --cr-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    position: fixed;
    inset: 0;
    z-index: 2147483000;
    pointer-events: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--cr-text);
  }
  .cr[hidden] { display: none; }
  .cr * { box-sizing: border-box; }
  .cr svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  /* The bar is the only resting surface. It never becomes an orb: closing simply slides
     the option slots back into it, leaving the compact grip + draw + palette shape. */
  .cr__bar {
    pointer-events: auto;
    position: fixed;
    left: var(--cr-bar-x, 16px);
    top: var(--cr-bar-y, 70vh);
    display: flex;
    align-items: center;
    gap: 5px;
    max-width: 94vw;
    padding: 5px 7px;
    border-radius: 999px;
    background: var(--cr-veil, #17171a);
    border: 1px solid var(--cr-hairline);
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.42);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    /* Opening can require sliding the bar left to stay on screen, so animate placement. */
    transition: left 280ms var(--cr-ease), top 280ms var(--cr-ease);
  }
  .cr__bar.is-dragging { transition: none; cursor: grabbing; }

  .cr__toggle {
    width: 22px; height: 26px; flex: 0 0 22px; padding: 3px 4px;
    color: var(--cr-faint); background: none; border: 0; cursor: pointer;
  }
  .cr__toggle svg { stroke-width: 2.4; transition: transform 260ms var(--cr-ease); }
  .cr__toggle:hover { color: var(--cr-text); }
  .cr__toggle:disabled { opacity: 0.4; cursor: default; }
  .cr.is-open .cr__toggle svg { transform: rotate(180deg); }

  .cr__draw {
    position: relative;
    display: flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 13px 0 10px;
    border: 0; border-radius: 999px;
    background: var(--cr-accent); color: var(--cr-accent-text, #14140f);
    font-size: calc(12px * var(--cr-fs)); font-weight: 680; letter-spacing: 0.2px;
    cursor: pointer; white-space: nowrap; flex: 0 0 auto;
  }
  .cr__draw:disabled { opacity: 0.55; cursor: default; }
  .cr__draw-icon { width: 14px; height: 14px; display: block; }
  .cr__draw-icon svg { stroke-width: 2.1; }
  .cr__draw-badge {
    min-width: 16px; height: 16px; padding: 0 4px; margin-left: 1px;
    border-radius: 8px; background: rgba(0, 0, 0, 0.26); color: var(--cr-accent-text, #14140f);
    font-size: calc(10px * var(--cr-fs)); font-weight: 750; line-height: 16px; text-align: center;
  }
  .cr__draw-badge[hidden] { display: none; }

  /* Slots animate their width so opening and closing glides instead of snapping. */
  .cr__slots {
    display: flex; align-items: center; gap: 4px;
    max-width: 0; opacity: 0; margin-left: -5px;
    overflow: hidden;
    transition: max-width 280ms var(--cr-ease), opacity 190ms ease, margin-left 280ms var(--cr-ease);
  }
  .cr.is-open .cr__slots { max-width: 300px; opacity: 1; margin-left: 0; }

  .cr__slot {
    position: relative;
    width: 34px; height: 34px; flex: 0 0 34px;
    padding: 7px;
    border-radius: 12px;
    background: var(--cr-surface);
    border: 1px solid var(--cr-hairline);
    color: var(--cr-muted);
    cursor: pointer;
    transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
  }
  .cr__slot:hover { color: var(--cr-text); }
  .cr__slot.is-active { background: var(--cr-accent-soft); border-color: var(--cr-accent); color: var(--cr-accent); }
  .cr__slot.is-used { border-style: dashed; opacity: 0.62; }
  .cr__slot-dot { position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--cr-accent); opacity: 0; transition: opacity 140ms ease; }
  .cr__slot.is-used .cr__slot-dot { opacity: 1; }
  .cr__tone-symbol {
    display: flex; width: 100%; height: 100%; align-items: center; justify-content: center;
    font-size: calc(16px * var(--cr-fs)); line-height: 1; white-space: nowrap;
  }
  .cr__tone-initial { font-size: calc(13px * var(--cr-fs)); font-weight: 750; }
  .cr__panel-icon .cr__tone-symbol { font-size: calc(17px * var(--cr-fs)); }
  .cr.has-many-options .cr__slots { gap: 3px; }
  .cr.has-many-options .cr__slot {
    width: 30px; height: 30px; flex-basis: 30px; padding: 6px; border-radius: 10px;
  }

  .cr__icon-btn {
    width: 28px; height: 28px; flex: 0 0 28px; padding: 6px;
    border-radius: 50%; border: 1px solid var(--cr-hairline);
    background: var(--cr-surface); color: var(--cr-muted); cursor: pointer;
  }
  .cr__icon-btn:hover { color: var(--cr-text); }
  .cr__icon-btn[aria-pressed="true"] {
    color: var(--cr-accent);
    border-color: var(--cr-accent);
    background: var(--cr-accent-soft);
  }

  .cr__sweep { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; background: transparent; }
  .cr__sweep[hidden] { display: none; }
  .cr__sweep::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 42%;
    background: linear-gradient(90deg, transparent, var(--cr-accent), transparent);
    animation: cr-sweep 1150ms linear infinite;
  }
  @keyframes cr-sweep { from { left: -45%; } to { left: 100%; } }

  /* Panels fade rather than pop, and sit above or below the bar depending on where the
     user has parked it. Visibility is delayed on close so the fade can finish. */
  .cr__panel {
    pointer-events: auto;
    position: fixed;
    left: 50%;
    width: min(94vw, 460px);
    max-height: min(52vh, 420px);
    display: flex; flex-direction: column;
    border-radius: 18px;
    background: var(--cr-veil-solid, #17171a);
    border: 1px solid var(--cr-hairline);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transform: translateX(-50%) translateY(8px) scale(0.985);
    transition: opacity 190ms ease, transform 220ms var(--cr-ease), visibility 0s linear 220ms;
  }
  .cr__panel.is-open {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(0) scale(1);
    transition: opacity 190ms ease, transform 220ms var(--cr-ease), visibility 0s;
  }
  .cr__panel.is-pinned { transform: none; }
  .cr__panel.is-pinned.is-open { transform: none; }
  .cr__panel.is-dragging { transition: none; }
  .cr.is-panel-above .cr__panel { bottom: var(--cr-panel-bottom, 140px); top: auto; }
  .cr:not(.is-panel-above) .cr__panel { top: var(--cr-panel-top, 140px); bottom: auto; }

  .cr__panel-head {
    display: flex; align-items: center; gap: 8px; padding: 11px 12px 8px;
    border-bottom: 1px solid var(--cr-hairline);
    cursor: grab; touch-action: none; user-select: none;
  }
  .cr__panel.is-dragging .cr__panel-head { cursor: grabbing; }
  .cr__panel-icon { width: 20px; height: 20px; flex: 0 0 20px; color: var(--cr-accent); }
  .cr__panel-label { flex: 1; min-width: 0; font-size: calc(12.5px * var(--cr-fs)); font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cr__panel-tools { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
  .cr__head-tool {
    position: relative;
    width: 28px; height: 28px; flex: 0 0 28px; padding: 5px;
    border: 1px solid var(--cr-hairline); border-radius: 9px;
    background: var(--cr-surface); color: var(--cr-muted); cursor: pointer;
  }
  .cr__head-tool:hover, .cr__head-tool[aria-expanded="true"] { color: var(--cr-accent); border-color: var(--cr-accent); }
  .cr__head-tool.has-instruction::after {
    content: ""; position: absolute; top: 3px; right: 3px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--cr-accent);
  }
  .cr__head-tool:disabled { opacity: 0.46; cursor: default; }
  .cr__head-tool.is-busy svg { animation: cr-wand-pulse 900ms ease-in-out infinite alternate; }
  @keyframes cr-wand-pulse { from { transform: rotate(-8deg) scale(0.92); } to { transform: rotate(7deg) scale(1.08); } }
  .cr__x { width: 26px; height: 26px; flex: 0 0 26px; padding: 0; border: 0; border-radius: 50%; background: var(--cr-surface); color: var(--cr-muted); font-size: 17px; line-height: 1; cursor: pointer; }
  .cr__x:hover { color: var(--cr-text); }

  .cr__enhance-prompt {
    flex: 0 0 auto;
    padding: 10px 12px 9px;
    border-bottom: 1px solid var(--cr-hairline);
    background: var(--cr-accent-soft);
  }
  .cr__enhance-prompt[hidden] { display: none; }
  .cr__enhance-label {
    display: block; margin-bottom: 6px; color: var(--cr-muted);
    font-size: calc(10.5px * var(--cr-fs)); font-weight: 650;
    text-transform: uppercase; letter-spacing: 0.55px;
  }
  .cr__enhance-ooc {
    display: block; width: 100%; min-height: 52px; max-height: 130px; resize: vertical;
    padding: 8px 9px; border: 1px solid var(--cr-hairline); border-radius: 10px;
    background: var(--cr-surface); color: var(--cr-text);
    font: inherit; font-size: calc(12px * var(--cr-fs)); line-height: 1.4;
  }
  .cr__enhance-ooc:focus { outline: 1px solid var(--cr-accent); border-color: var(--cr-accent); }
  .cr__enhance-ooc::placeholder { color: var(--cr-faint); }
  .cr__enhance-ooc:disabled { opacity: 0.55; }
  .cr__enhance-actions { display: flex; align-items: center; gap: 9px; margin-top: 7px; }
  .cr__enhance-actions .cr__hint { flex: 1; min-width: 0; margin: 0; }
  .cr__enhance-run {
    height: 31px; flex: 0 0 auto; padding: 0 11px;
    border: 0; border-radius: 9px; background: var(--cr-accent); color: var(--cr-accent-text, #14140f);
    font-size: calc(11.5px * var(--cr-fs)); font-weight: 680; white-space: nowrap; cursor: pointer;
  }
  .cr__enhance-run:disabled { opacity: 0.46; cursor: default; }
  .cr__bubble.is-enhancing .cr__panel-body { opacity: 0.62; }

  .cr__panel-body {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 12px;
    font-size: calc(13px * var(--cr-fs)); line-height: 1.52;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .cr__theme-body { white-space: normal; }

  .cr__panel-foot { display: flex; gap: 8px; padding: 9px 12px 11px; border-top: 1px solid var(--cr-hairline); }
  .cr__use { flex: 1; height: 34px; border: 0; border-radius: 11px; background: var(--cr-accent); color: var(--cr-accent-text, #14140f); font-size: calc(12.5px * var(--cr-fs)); font-weight: 680; cursor: pointer; }
  .cr__ghost { height: 34px; padding: 0 14px; border: 1px solid var(--cr-hairline); border-radius: 11px; background: transparent; color: var(--cr-muted); font-size: calc(12px * var(--cr-fs)); cursor: pointer; white-space: nowrap; }
  .cr__ghost:hover { color: var(--cr-text); }
  .cr__use:disabled, .cr__ghost:disabled { opacity: 0.5; cursor: default; }

  .cr__theme { max-height: min(74vh, 560px); max-height: min(74dvh, 560px); }
  .cr__tabs {
    display: flex; flex: 0 0 auto; gap: 2px;
    padding: 0 8px; border-bottom: 1px solid var(--cr-hairline);
  }
  .cr__tab {
    flex: 1; min-width: 0; padding: 8px 4px 7px;
    border: 0; border-bottom: 2px solid transparent; background: none;
    color: var(--cr-muted); cursor: pointer;
    font: inherit; font-size: calc(11.5px * var(--cr-fs)); font-weight: 620;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cr__tab:hover { color: var(--cr-text); }
  .cr__tab.is-on { color: var(--cr-accent); border-bottom-color: var(--cr-accent); }
  .cr__tone-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .cr__tone-head .cr__row-label { flex: 1; margin-bottom: 0; }
  .cr__mini {
    flex: 0 0 auto; height: 27px; padding: 0 10px;
    border: 1px solid var(--cr-hairline); border-radius: 9px;
    background: var(--cr-surface); color: var(--cr-muted);
    font: inherit; font-size: calc(11px * var(--cr-fs)); font-weight: 620;
    white-space: nowrap; cursor: pointer;
  }
  .cr__mini:hover { color: var(--cr-text); border-color: var(--cr-accent); }
  .cr__mini:disabled { opacity: 0.45; cursor: default; }
  .cr__mini--primary { background: var(--cr-accent); border-color: var(--cr-accent); color: var(--cr-accent-text, #14140f); }
  .cr__mini--primary:hover { color: var(--cr-accent-text, #14140f); }
  .cr__mini--danger { color: #d2694a; border-color: rgba(210, 105, 74, 0.4); }
  .cr__tone-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 9px; }
  .cr__tone-row {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 7px 9px; text-align: left;
    border: 1px solid var(--cr-hairline); border-radius: 11px;
    background: var(--cr-surface); color: inherit; font: inherit; cursor: pointer;
  }
  .cr__tone-row:hover { border-color: var(--cr-accent); }
  .cr__tone-row-icon { flex: 0 0 20px; width: 20px; height: 20px; color: var(--cr-accent); }
  .cr__tone-row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .cr__tone-row-label { font-size: calc(12px * var(--cr-fs)); font-weight: 650; }
  .cr__tone-row-brief {
    font-size: calc(11px * var(--cr-fs)); line-height: 1.4; color: var(--cr-muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cr__tone-row-brief.is-empty { color: var(--cr-faint); font-style: italic; }
  .cr__tone-row-go { flex: 0 0 auto; color: var(--cr-faint); font-size: calc(12px * var(--cr-fs)); }
  .cr__field-label {
    display: block; margin: 9px 0 4px; color: var(--cr-muted);
    font-size: calc(10.5px * var(--cr-fs)); font-weight: 650;
    text-transform: uppercase; letter-spacing: 0.55px;
  }
  .cr__field {
    display: block; width: 100%; padding: 8px 9px;
    border: 1px solid var(--cr-hairline); border-radius: 10px;
    background: var(--cr-surface); color: var(--cr-text);
    font: inherit; font-size: calc(12px * var(--cr-fs)); line-height: 1.4;
  }
  .cr__field:focus { outline: 1px solid var(--cr-accent); border-color: var(--cr-accent); }
  .cr__field::placeholder { color: var(--cr-faint); }
  .cr__field--icon { width: 84px; text-align: center; font-size: calc(15px * var(--cr-fs)); }
  .cr__field--area { resize: vertical; min-height: 58px; max-height: 200px; }
  .cr__field--tall { min-height: 150px; max-height: 320px; }
  .cr__field--compact { width: 94px; min-width: 78px; padding: 7px 8px; text-align: right; }
  .cr__field--password { padding-right: 34px; }
  .cr__emoji-grid { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
  .cr__emoji {
    width: 30px; height: 30px; padding: 0;
    border: 1px solid var(--cr-hairline); border-radius: 8px;
    background: var(--cr-surface); cursor: pointer;
    font-size: calc(15px * var(--cr-fs)); line-height: 1;
  }
  .cr__emoji:hover { border-color: var(--cr-accent); }
  .cr__tone-actions { display: flex; gap: 7px; margin-top: 13px; }

  function pathCount() {
    var n = Math.round(Number(cfg("pathCount", DEFAULT_PATH_COUNT)));

  function publishPathHeartbeat() {

  function storedBarVisible() {

  function applyBarVisibility(visible) {
    var next = visible !== false;
    var changed = next !== barVisible;
    barVisible = next;

    if (!barVisible) {
      if (changed) {

    }

    if (!mounted) {

    var wasHidden = root.hidden;

  function toast(message) {
    try { return Promise.resolve(tavo.utils.toast(message)); } catch (_) { return Promise.resolve(); }
  }

  function announce(message) {
    if (!liveEl) return;
    liveEl.textContent = "";
    setTimeout(function () { if (liveEl) liveEl.textContent = String(message || ""); }, 20);
  }

  function cap(value, limit) {
    var text = value == null ? "" : String(value);
    return text.length > limit ? text.slice(0, limit - 1).trimEnd() + "…" : text;
  }

  function customEndpointUrl(base) {
    var trimmed = String(base || "").trim();
    if (!/^https?:\/\//i.test(trimmed)) {
      throw new Error("The separate API URL must begin with http:// or https://.");
    }
    // Inspect and extend only the path. Query strings are required by endpoints such as
    // Azure-compatible gateways and must remain after /chat/completions, not in its middle.
    var parts = trimmed.match(/^([^?#]*)([?#][\s\S]*)?$/);
    var endpointPath = (parts ? parts[1] : trimmed).replace(/\/+$/, "");
    var suffix = parts && parts[2] ? parts[2] : "";
    if (/\/chat\/completions$/i.test(endpointPath)) return endpointPath + suffix;
    if (/\/v1$/i.test(endpointPath)) return endpointPath + "/chat/completions" + suffix;
    return endpointPath + "/v1/chat/completions" + suffix;
  }

  function responseFormatRejected(status, responseBody) {
    if ([400, 404, 415, 422].indexOf(Number(status)) < 0) return false;
    return /response[_ -]?format|json[_ -]?(?:object|mode|schema)|structured[_ -]?output/i.test(
      String(responseBody || "")
    );
  }

  function openAIContentText(value) {
    if (typeof value === "string") return value;
    if (!Array.isArray(value)) return "";
    return value.map(function (part) {
      if (typeof part === "string") return part;
      if (part && typeof part.text === "string") return part.text;
      if (part && typeof part.content === "string") return part.content;
      return "";
    }).join("");
  }

  function openAIResponseText(data) {
    if (!data || typeof data !== "object") return "";
    if (typeof data.output_text === "string") return data.output_text;
    var choice = Array.isArray(data.choices) ? data.choices[0] : null;
    if (choice && choice.message) {
      var messageText = openAIContentText(choice.message.content);
      if (messageText) return messageText;
      // Some reasoning-compatible providers put the entire answer in a reasoning field
      // when normal content is empty. Use it only as a fallback; the balanced JSON parser
      // below will ignore leading analysis and select the final options object.
      var reasoningText = openAIContentText(choice.message.reasoning) ||
        openAIContentText(choice.message.reasoning_content) ||
        openAIContentText(choice.message.reasoning_details);
      if (reasoningText) return reasoningText;
    }
    if (choice && typeof choice.text === "string") return choice.text;
    if (Array.isArray(data.output)) {
      var outputText = data.output.map(function (item) {
        if (!item || typeof item !== "object") return "";
        return openAIContentText(item.content) || openAIContentText(item.text);
      }).join("");
      if (outputText) return outputText;
    }
    return "";
  }

  function openAIFinishReason(data) {
    var choice = data && Array.isArray(data.choices) ? data.choices[0] : null;
    var reason = choice && (choice.finish_reason || choice.stop_reason);
    if (!reason && data && data.status && data.status !== "completed") reason = data.status;
    return reason == null ? "" : String(reason);
  }

  async function generateText(prompt, options) {
    if (options && options.path === true && cfgEnabled("pathUseCustomApi", false)) {
      return await generateViaCustomApi(prompt, options, "paths");
    }
    if (cfgEnabled("useCustomApi", false)) {
      return await generateViaCustomApi(prompt, options || {}, "main");
    }
    if (options && options.context === true) {
      return await tavo.generate(prompt, { context: true });
    }
    return await tavo.generate(prompt);
  }

  async function generateViaCustomApi(prompt, options, kind) {
    var paths = kind === "paths";
    var urlKey = paths ? "pathApiUrl" : "customApiUrl";
    var keyKey = paths ? "pathApiKey" : "customApiKey";
    var modelKey = paths ? "pathApiModel" : "customApiModel";
    var tokensKey = paths ? "pathApiMaxTokens" : "customApiMaxTokens";
    var temperatureKey = paths ? "pathApiTemperature" : "customApiTemperature";
    var connectionLabel = paths ? "Response Paths API" : "separate API";
    var url = String(cfg(urlKey, "") || "").trim();
    var model = String(cfg(modelKey, "") || "").trim();
    if (!url) throw new Error("Set the " + connectionLabel + " URL in Crossroads settings.");
    if (!model) throw new Error("Set the " + connectionLabel + " model name in Crossroads settings.");

    var requestPrompt = String(prompt || "");
    if (options && options.context === true) {
      var messages = Array.isArray(options.messages) ? options.messages : await recentMessages();
      var ids = options.ids || await identities(messages);
      requestPrompt = buildStandaloneContextPrompt(requestPrompt, messages, ids);
    }

    var temperature = clampNumber(cfg(temperatureKey, 0.9), 0, 2, 0.9);
    var body = {
      model: model,
      messages: [{ role: "user", content: requestPrompt }],
      temperature: temperature,
      stream: false
    };
    // OpenAI-compatible JSON mode prevents most syntax failures before the parser ever sees
    // them. If an older endpoint explicitly rejects response_format, retry that rejected
    // request once without the field; a validation rejection does not consume a generation.
    if (options && options.json === true) {
      body.response_format = { type: "json_object" };
    }
    var maxTokens = Math.floor(Number(cfg(tokensKey, 0)) || 0);
    if (maxTokens > 0) body.max_tokens = maxTokens;

    var headers = { "Content-Type": "application/json" };
    var apiKey = String(cfg(keyKey, "") || "").trim();
    if (apiKey) headers.Authorization = "Bearer " + apiKey;

    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, REQUEST_TIMEOUT_MS);
    var response;
    var responseBody;
    try {
      var endpoint = customEndpointUrl(url);
      var send = async function () {
        var sent = await fetch(endpoint, {
          method: "POST",
          headers: headers,
          body: JSON.stringify(body),
          signal: controller.signal
        });
        return { response: sent, responseBody: await sent.text() };
      };
      var attempt = await send();
      response = attempt.response;
      responseBody = attempt.responseBody;
      if (!response.ok && body.response_format &&
          responseFormatRejected(response.status, responseBody)) {
        delete body.response_format;
        attempt = await send();
        response = attempt.response;
        responseBody = attempt.responseBody;
      }
    } catch (error) {
      if (controller.signal.aborted) {
        throw new Error("The " + connectionLabel + " timed out after " + Math.round(REQUEST_TIMEOUT_MS / 1000) + " seconds.");
      }
      throw new Error("Could not reach the " + connectionLabel + ". Check its URL, network access, and CORS policy. " +
        (error && error.message ? error.message : String(error)));
    } finally {
      clearTimeout(timer);
    }

    if (!response.ok) {
      if (response.status === 401 || response.status === 403) {
        throw new Error("The " + connectionLabel + " rejected the credentials (" + response.status + "). Check the API key.");
      }
      throw new Error("The " + connectionLabel + " request failed (" + response.status + "): " +
        cap(responseBody || response.statusText || "Unknown error", 300));
    }

    var data;
    try { data = JSON.parse(responseBody); } catch (_) {
      throw new Error("The " + connectionLabel + " returned a non-JSON response.");
    }
    var text = openAIResponseText(data);
    if (!text || !String(text).trim()) throw new Error("The " + connectionLabel + " returned an empty response.");
    return {
      text: text,
      finishReason: openAIFinishReason(data),
      usage: data && data.usage ? data.usage : null,
      requestedMaxTokens: maxTokens > 0 ? maxTokens : null,
      provider: "custom-api"
    };
  }

  function wordCount(value) {
    var text = String(value == null ? "" : value).trim();
    return text ? text.split(/\s+/).length : 0;
  }

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function clampNumber(value, min, max, fallback) {
    var n = Number(value);
    if (!Number.isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  function isHexColor(value) { return /^#[0-9a-f]{6}$/i.test(String(value || "")); }

  function normalizeToneKey(value) {
    return String(value == null ? "" : value).trim().toLowerCase().replace(/\s+/g, " ");
  }

  // Array.from keeps surrogate-pair and joined emoji intact. Eight code points leaves room
  // for a variation selector while stopping a pasted word from filling a compact tone slot.
  function toneProfile(label, icon, prompt) {
    var text = String(label == null ? "" : label).trim()
      .slice(0, MAX_TONE_LABEL_CHARS).trim();
    return {
      key: normalizeToneKey(text),
      label: text,
      icon: Array.from(String(icon == null ? "" : icon).trim()).slice(0, 8).join(""),
      prompt: cap(String(prompt == null ? "" : prompt).trim(), MAX_TONE_PROMPT_CHARS)
    };
  }

  // Read the old settings textarea only while seeding the new editable palette. This keeps
  // every 1.3.3 custom tone during the upgrade without making users maintain two lists.
  function legacyToneProfiles() {
    var raw = String(cfg("customTones", "") || "").trim();
    if (!raw) return [];
    var sourceLines = raw.split(/\r?\n/);
    if (sourceLines.length === 1 && (raw.match(/\|/g) || []).length > 1) {
      sourceLines = raw.split(/\s*,\s*/);
    }
    var out = [];
    sourceLines.forEach(function (sourceLine) {
      var line = String(sourceLine || "").trim();
      if (!line) return;
      var divider = line.indexOf("|");
      var tone = toneProfile(
        divider >= 0 ? line.slice(0, divider) : line,
        divider >= 0 ? line.slice(divider + 1) : "",
        ""
      );
      if (tone.key) out.push(tone);
    });
    return out;
  }

  function builtInProfiles() {
    return Object.keys(BUILTIN_TONES).map(function (key) {
      return toneProfile(BUILTIN_TONES[key].label, "", "");
    });
  }

  function seedPalette() {
    var out = cfgEnabled("replaceBuiltInTones", false) ? [] : builtInProfiles();
    var seen = Object.create(null);
    out.forEach(function (tone) { seen[tone.key] = true; });
    legacyToneProfiles().forEach(function (tone) {
      if (seen[tone.key]) {
        var index = out.findIndex(function (entry) { return entry.key === tone.key; });
        if (index >= 0) out[index] = tone;
      } else if (out.length < MAX_TONES) {
        seen[tone.key] = true;
        out.push(tone);
      }
    });
    return out.length ? out.slice(0, MAX_TONES) : builtInProfiles();
  }

  // Never let a malformed or emptied saved list make generation impossible.
  function palette() {
    if (!barSettings || typeof barSettings !== "object") loadBarSettings();
    var saved = barSettings.tones;
    if (!Array.isArray(saved)) return seedPalette();
    var out = [];
    var seen = Object.create(null);
    saved.forEach(function (entry) {
      if (!entry || typeof entry !== "object" || out.length >= MAX_TONES) return;
      var tone = toneProfile(entry.label, entry.icon, entry.prompt);
      if (!tone.key || seen[tone.key]) return;
      seen[tone.key] = true;
      out.push(tone);
    });
    return out.length ? out : seedPalette();
  }

  function savePalette(list) {
    if (!barSettings || typeof barSettings !== "object") loadBarSettings();
    barSettings.tones = list.slice(0, MAX_TONES).map(function (tone) {
      return { key: tone.key, label: tone.label, icon: tone.icon, prompt: tone.prompt };
    });
    saveBarSettings();
  }

  function migrateTones() {
    if (!barSettings || typeof barSettings !== "object") loadBarSettings();
    if (!Array.isArray(barSettings.tones)) savePalette(seedPalette());
  }

  function toneDefinitions() {
    return palette().map(function (tone) {
      var builtIn = Object.prototype.hasOwnProperty.call(BUILTIN_TONES, tone.key)
        ? BUILTIN_TONES[tone.key]
        : null;
      return {
        key: tone.key,
        label: tone.label,
        icon: tone.icon,
        prompt: tone.prompt,
        path: !tone.icon && builtIn ? builtIn.path : ""
      };
    });
  }

  function shuffledTones(list, random) {
    var out = list.slice();
    var nextRandom = typeof random === "function" ? random : Math.random;
    for (var i = out.length - 1; i > 0; i -= 1) {
      var sample = Number(nextRandom());
      if (!Number.isFinite(sample)) sample = 0;
      sample = Math.min(0.999999999, Math.max(0, sample));
      var j = Math.floor(sample * (i + 1));
      var held = out[i];
      out[i] = out[j];
      out[j] = held;
    }
    return out;
  }

  function toneShortlist(count, random) {
    var all = shuffledTones(toneDefinitions(), random);
    return all.slice(0, Math.min(all.length, count + TONE_SHORTLIST_EXTRA));
  }

  function tonePaletteBlock(tones, count, custom) {
    var briefed = tones.some(function (tone) { return !!tone.prompt; });
    var lines = tones.map(function (tone) {
      return tone.prompt
        ? JSON.stringify(tone.label) + " - " + tone.prompt
        : JSON.stringify(tone.label);
    });
    var out = [tones.length > count
      ? 'TONE PALETTE - the "tone" field must be exactly one of these ' + tones.length +
        " JSON strings, copied character for character. Choose the " + count +
        " that fit this moment best:"
      : 'TONE PALETTE - the "tone" field must be exactly one of these JSON strings, copied character for character:'
    ].concat(lines);
    if (count > 1 && tones.length > 1) {
      out.push("Give every option a different tone. Never assign the same tone twice.");
    }
    if (briefed) {
      out.push("A brief after a tone governs only the option carrying that tone. A tone without a brief carries its plain meaning.");
      if (custom) {
        out.push("The custom choice instruction still applies to every option. If a tone brief conflicts with it, follow the custom instruction.");
      }
    }
    return out.join("\n");
  }

  // Retained for local repair and backwards-compatible restored draws. Runtime prompts use
  // a rotating shortlist, but malformed or duplicated model tones still need deterministic
  // local fallbacks rather than another paid generation.
  function randomToneSequence(count, choices, random) {
    var available = choices || toneDefinitions();
    if (!available.length) available = toneDefinitions();
    var length = Math.max(1, Math.floor(Number(count) || 1));
    var sequence = [];
    var shuffled = [];
    while (sequence.length < length) {
      shuffled = shuffledTones(available, random);
      sequence = sequence.concat(shuffled.slice(0, length - sequence.length));
    }
    return sequence;
  }

  function resolvedTonePlan(plan, count, choices) {
    if (!Array.isArray(plan) || plan.length < count) return [];
    var available = choices || toneDefinitions();
    var resolved = [];
    for (var i = 0; i < count; i += 1) {
      var planned = plan[i];
      var match = planned && typeof planned === "object" && planned.key
        ? available.find(function (entry) { return entry.key === planned.key; })
        : findTone(planned, available);
      if (!match) return [];
      resolved.push(match);
    }
    return resolved;
  }

  function findTone(tone, choices) {
    var available = choices || toneDefinitions();
    var raw = String(tone == null ? "" : tone).trim();
    var key = normalizeToneKey(raw);
    var exact = available.find(function (entry) { return entry.key === key; });
    if (exact) return exact;

    // Be forgiving when a model echoes the settings syntax or appends the display emoji.
    var divider = raw.indexOf("|");
    if (divider >= 0) {
      var beforeDivider = normalizeToneKey(raw.slice(0, divider));
      exact = available.find(function (entry) { return entry.key === beforeDivider; });
      if (exact) return exact;
    }
    return available.find(function (entry) {
      return !!entry.icon && normalizeToneKey(entry.label + " " + entry.icon) === key;
    }) || null;
  }

  function fallbackTone(choices) {
    var available = choices || toneDefinitions();
    return available.find(function (entry) { return entry.key === DEFAULT_TONE_KEY; }) || available[0];
  }

  function toneIcon(tone) {
    var entry = findTone(tone) || fallbackTone();
    if (entry.icon) {
      return '<span class="cr__tone-symbol" aria-hidden="true">' + escapeHtml(entry.icon) + "</span>";
    }
    if (entry.path) {
      return '<svg viewBox="0 0 24 24" aria-hidden="true">' + entry.path + "</svg>";
    }
    var chars = Array.from(entry.label || "?");
    var initial = chars.find(function (char) { return /[A-Za-z0-9]/.test(char); }) || chars[0] || "?";
    return '<span class="cr__tone-symbol cr__tone-initial" aria-hidden="true">' +
      escapeHtml(initial.toUpperCase()) + "</span>";
  }

  function toneLabel(tone) { return (findTone(tone) || fallbackTone()).label; }

  function panelOpen(el) { return !!el && el.classList.contains("is-open"); }
  function setPanel(el, open) { if (el) el.classList.toggle("is-open", !!open); }

  function enhancePromptOpen() { return !!enhancePromptEl && !enhancePromptEl.hidden; }

  function syncEnhanceControls() {
    var hasInstruction = !!(enhanceOocEl && enhanceOocEl.value.trim());
    if (enhanceBtn) enhanceBtn.disabled = busy || !hasInstruction;
    if (enhanceOocToggleBtn) enhanceOocToggleBtn.classList.toggle("has-instruction", hasInstruction);
  }

  function setEnhancePrompt(open) {
    var showing = !!open;
    if (enhancePromptEl) enhancePromptEl.hidden = !showing;
    if (enhanceOocToggleBtn) enhanceOocToggleBtn.setAttribute("aria-expanded", showing ? "true" : "false");
    syncEnhanceControls();
    if (showing && enhanceOocEl) {
      setTimeout(function () { try { enhanceOocEl.focus(); } catch (_) {} }, 0);
    }
  }

  /* ---------- appearance and placement ---------- */

  function loadUi() {
    var saved = readVar(UI_KEY, "global");
    if (saved && typeof saved === "object") {
      if (isHexColor(saved.accent)) ui.accent = saved.accent;
      if (isHexColor(saved.backdrop)) ui.backdrop = saved.backdrop;
      ui.barX = saved.barX == null ? null : Number(saved.barX);
      ui.barY = saved.barY == null ? null : Number(saved.barY);
      ui.panelX = saved.panelX == null ? null : Number(saved.panelX);
      ui.panelY = saved.panelY == null ? null : Number(saved.panelY);
      ui.pathsX = saved.pathsX == null ? null : Number(saved.pathsX);
      ui.pathsY = saved.pathsY == null ? null : Number(saved.pathsY);
      ui.open = saved.open === true;
    }
  }

  function saveUi() { writeVar(UI_KEY, ui, "global"); }

  function barSize() {
    var rect = barEl ? barEl.getBoundingClientRect() : null;
    return { w: rect && rect.width ? rect.width : 180, h: rect && rect.height ? rect.height : 42 };
  }

  // Width the bar will occupy once the slots have finished sliding out. The slots are
  // clipped to max-width 0 while closed, but scrollWidth still reports their real extent,
  // so the bar can be moved clear of the right edge before it grows instead of after.
  function predictedOpenWidth() {
    var current = barSize().w;
    if (ui.open || !slotsEl || !options.length) return current;
    var extra = slotsEl.scrollWidth || 0;
    return current + (extra ? extra + 5 : 0);
  }

  // Keep the bar on screen after a rotation, a keyboard opening, or an expand that grew it.
  function clampBar(widthOverride) {
    var size = barSize();
    var width = Math.max(size.w, Number(widthOverride) || 0);
    var maxX = Math.max(BAR_MARGIN, window.innerWidth - width - BAR_MARGIN);
    var maxY = Math.max(BAR_MARGIN, window.innerHeight - size.h - BAR_MARGIN);
    var defaultX = Math.max(BAR_MARGIN, Math.round((window.innerWidth - width) / 2));
    var defaultY = Math.max(BAR_MARGIN, Math.round(window.innerHeight * 0.78));
    ui.barX = clampNumber(ui.barX == null ? defaultX : ui.barX, BAR_MARGIN, maxX, defaultX);
    ui.barY = clampNumber(ui.barY == null ? defaultY : ui.barY, BAR_MARGIN, maxY, defaultY);
  }

  function applyBarPosition() {
    root.style.setProperty("--cr-bar-x", ui.barX + "px");
    root.style.setProperty("--cr-bar-y", ui.barY + "px");
    positionPanels();
  }

  // Panels sit above the bar when it is parked low, and below it when parked high.
  function positionPanels() {
    var panels = [bubbleEl, themeEl].filter(Boolean);
    if (ui.panelX != null && ui.panelY != null) {
      var active = panelOpen(themeEl) ? themeEl : (panelOpen(bubbleEl) ? bubbleEl : themeEl);
      var width = active ? (active.offsetWidth || 460) : 460;
      var height = active ? (active.offsetHeight || 320) : 320;
      var x = clampNumber(Number(ui.panelX), 8,
        Math.max(8, window.innerWidth - width - 8), 8);
      var y = clampNumber(Number(ui.panelY), 8,
        Math.max(8, window.innerHeight - height - 8), 8);
      ui.panelX = x;
      ui.panelY = y;
      panels.forEach(function (panel) {
        panel.classList.add("is-pinned");
        panel.style.left = x + "px";
        panel.style.top = y + "px";
        panel.style.bottom = "auto";
      });
      return;
    }
    panels.forEach(function (panel) {
      panel.classList.remove("is-pinned");
      panel.style.left = "";
      panel.style.top = "";
      panel.style.bottom = "";
    });
    var size = barSize();
    var above = ui.barY > window.innerHeight * 0.45;
    root.classList.toggle("is-panel-above", above);
    if (above) root.style.setProperty("--cr-panel-bottom", Math.max(8, window.innerHeight - ui.barY + 10) + "px");
    else root.style.setProperty("--cr-panel-top", Math.max(8, ui.barY + size.h + 10) + "px");
  }

  function applyUi() {
    applyThemeVars(root);
    applyThemeVars(pathsEl);
    root.classList.toggle("is-open", ui.open && options.length > 0);
    clampBar();
    applyBarPosition();
    renderBadge();
  }

  function hexToRgba(hex, alpha) {
    if (!isHexColor(hex)) return "rgba(23, 23, 26, " + alpha + ")";
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return "rgba(" + r + ", " + g + ", " + b + ", " + alpha + ")";
  }

  function relativeLuminance(hex) {
    if (!isHexColor(hex)) return 0;
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  }

  function contrastTextFor(hex) {
    return relativeLuminance(hex) > 0.6 ? "#14140f" : "#ffffff";
  }

  function textTierFor(hex) {
    return relativeLuminance(hex) > 0.6
      ? { text: "#1c1a16", muted: "#5c564d", faint: "#8a8479", hairline: "rgba(0, 0, 0, 0.12)" }
      : { text: "#ece9e3", muted: "#a4a09a", faint: "#6f6c68", hairline: "rgba(255, 255, 255, 0.09)" };
  }

  function applyThemeVars(el) {
    if (!el) return;
    el.style.setProperty("--cr-accent", ui.accent);
    el.style.setProperty("--cr-accent-soft", hexToRgba(ui.accent, 0.16));
    el.style.setProperty("--cr-accent-text", contrastTextFor(ui.accent));
    el.style.setProperty("--cr-bg", ui.backdrop);
    // Precomputed rather than color-mix(), for older mobile WebViews.
    el.style.setProperty("--cr-veil", hexToRgba(ui.backdrop, 0.92));
    el.style.setProperty("--cr-veil-solid", hexToRgba(ui.backdrop, 0.96));
    el.style.setProperty("--cr-surface", hexToRgba(mixToward(ui.backdrop, 255, 0.07), 1));
    var tier = textTierFor(ui.backdrop);
    el.style.setProperty("--cr-text", tier.text);
    el.style.setProperty("--cr-muted", tier.muted);
    el.style.setProperty("--cr-faint", tier.faint);
    el.style.setProperty("--cr-hairline", tier.hairline);
  }

  // Nudge a colour toward white (or black) so surfaces stay visible against any backdrop.
  function mixToward(hex, target, amount) {
    if (!isHexColor(hex)) return hex;
    var parts = [1, 3, 5].map(function (start) {
      var channel = parseInt(hex.slice(start, start + 2), 16);
      var mixed = Math.round(channel + (target - channel) * amount);
      return Math.min(255, Math.max(0, mixed)).toString(16).padStart(2, "0");
    });
    return "#" + parts.join("");
  }

  function openBar() {
    if (ui.open || !options.length) return;
    // Move clear of the right edge first, using the width the bar is about to become.
    clampBar(predictedOpenWidth());
    applyBarPosition();
    ui.open = true;
    applyUi();
    saveUi();
    // Settle against the real width once the slots have finished sliding out.
    setTimeout(function () { clampBar(); applyBarPosition(); }, 320);
  }

  // Slide the slots away, leaving the compact bar. Options are kept, not discarded.
  function closeBar() {
    if (!ui.open) return;
    ui.open = false;
    closing = true;
    closeBubble();
    setPanel(themeEl, false);
    applyUi();
    saveUi();
    // Let the slots finish retracting before the count appears, so the bar only ever
    // narrows during the slide instead of briefly widening as the badge pops in.
    setTimeout(function () {
      closing = false;
      clampBar();
      applyBarPosition();
      renderBadge();
    }, 310);
    announce("Options closed. " + unusedCount() + " still available.");
  }

  function unusedCount() {
    return options.filter(function (option) { return !usedIds[option.id]; }).length;
  }

  function renderBadge() {
    if (!badgeEl) return;
    var count = unusedCount();
    var show = !ui.open && !closing && count > 0;
    badgeEl.hidden = !show;
    badgeEl.textContent = String(count);
  }

  /* ---------- settings panel (tones / instruction / settings / appearance) ---------- */

    if (!themeBodyEl) return;
    var tabs = root.querySelectorAll("[data-cr-tab]");

      : themeTab === "settings" ? settingsTabHtml()

      }) +

      }) +

  function settingsField(key) {
    return themeBodyEl && themeBodyEl.querySelector('[data-cr-setting="' + key + '"]');
  }

  function saveSettingsFromForm() {
    var current = loadRuntimeSettings() || migrateRuntimeSettings();
    var next = Object.assign({}, current);
    ["contextAll", "planningStep", "pathUseCustomApi", "useCustomApi"].forEach(function (key) {
      var input = settingsField(key);
      if (input) next[key] = input.checked === true;
    });
    ["storyLanguage", "pathApiUrl", "pathApiKey", "pathApiModel", "customApiUrl", "customApiKey", "customApiModel"].forEach(function (key) {
      var input = settingsField(key);
      if (input) next[key] = String(input.value || "");
    });

    var invalid = null;
    [
      ["optionCount", 1, MAX_OPTION_COUNT],
      ["contextResponses", 1, MAX_RESPONSE_WINDOW],
      ["pathCount", 2, MAX_PATH_COUNT],
      ["pathApiMaxTokens", 0, MAX_API_TOKENS],
      ["pathApiTemperature", 0, 2],
      ["customApiMaxTokens", 0, MAX_API_TOKENS],
      ["customApiTemperature", 0, 2]
    ].forEach(function (spec) {
      var input = settingsField(spec[0]);
      if (!input) return;
      var raw = String(input.value == null ? "" : input.value).trim();
      var value = raw ? Number(raw) : NaN;
      if (!Number.isFinite(value) || value < spec[1] || value > spec[2]) {
        input.setAttribute("aria-invalid", "true");
        if (!invalid) invalid = input;
      } else {
        input.removeAttribute("aria-invalid");
        next[spec[0]] = value;
      }
    });
    if (invalid) {
      try { invalid.focus(); } catch (_) {}
      toast("Enter a valid number within each setting’s shown range.");
      announce("Settings were not saved. A numeric value is invalid.");
      return false;
    }

    var invalidConnection = null;
    [
      { enabled: next.pathUseCustomApi, kind: "paths", url: "pathApiUrl", model: "pathApiModel" },
      { enabled: next.useCustomApi, kind: "main", url: "customApiUrl", model: "customApiModel" }
    ].forEach(function (connection) {
      if (!connection.enabled || invalidConnection) return;
      var url = settingsField(connection.url);
      var model = settingsField(connection.model);
      try {
        customEndpointUrl(url ? url.value : "");
      } catch (_) {
        if (url) url.setAttribute("aria-invalid", "true");
        invalidConnection = { input: url, kind: connection.kind, message: "Enter an http:// or https:// URL for the enabled separate API." };
        return;
      }
      if (url) url.removeAttribute("aria-invalid");
      if (!model || !String(model.value || "").trim()) {
        if (model) model.setAttribute("aria-invalid", "true");
        invalidConnection = { input: model, kind: connection.kind, message: "Enter a model name for the enabled separate API." };
      } else {
        model.removeAttribute("aria-invalid");
      }
    });
    if (invalidConnection) {
      var details = themeBodyEl && themeBodyEl.querySelector('[data-cr-api-details="' + invalidConnection.kind + '"]');
      if (details) details.open = true;
      try { if (invalidConnection.input) invalidConnection.input.focus(); } catch (_) {}
      toast(invalidConnection.message);
      announce("Settings were not saved. The enabled API connection is incomplete.");
      return false;
    }

    saveRuntimeSettings(next);
    renderTheme();
    toast("Crossroads settings saved.");
    announce("Crossroads settings saved for every chat.");
    return true;
  }

  function appearanceTabHtml() {

    ACCENTS.forEach(function (color) {

    html += '<input class="cr__hex" data-cr-accent-hex type="text" value="' +
      escapeHtml(ui.accent) + '" aria-label="Custom accent hex" /></div></div>';
    html += '<div class="cr__row"><span class="cr__row-label">Backdrop</span><div class="cr__swatches">';
    BACKDROPS.forEach(function (color) {
      html += '<button class="cr__swatch' + (ui.backdrop === color ? " is-on" : "") +
        '" type="button" data-cr-backdrop="' + color + '" style="background:' + color +
        '" aria-label="Backdrop ' + color + '"></button>';
    });
    html += '<input class="cr__hex" data-cr-backdrop-hex type="text" value="' +
      escapeHtml(ui.backdrop) + '" aria-label="Custom backdrop hex" /></div></div>';
    html += '<div class="cr__row"><span class="cr__row-label">Placement</span>' +
      '<p class="cr__hint">Drag the bar anywhere on screen. Drag a popup by its title strip; saved positions are clamped back onto smaller screens.</p>' +
      ((ui.panelX != null || ui.pathsX != null)
        ? '<button class="cr__mini" type="button" data-cr-reset-panels>Reset popup positions</button>'
        : "") + "</div>";
    return html;
  }

  function openToneEditor(index) {
    var list = palette();
    var existing = index >= 0 ? list[index] : null;
    toneDraft = {
      index: existing ? index : -1,
      label: existing ? existing.label : "",
      icon: existing ? existing.icon : "",
      prompt: existing ? existing.prompt : ""
    };
    renderTheme();
    var field = root.querySelector("[data-cr-tone-label]");
    if (field) setTimeout(function () { try { field.focus(); } catch (_) {} }, 0);
  }

  function readToneFields() {
    var labelEl = root.querySelector("[data-cr-tone-label]");
    var iconEl = root.querySelector("[data-cr-tone-icon]");
    var promptEl = root.querySelector("[data-cr-tone-prompt]");
    return toneProfile(
      labelEl ? labelEl.value : "",
      iconEl ? iconEl.value : "",
      promptEl ? promptEl.value : ""
    );
  }

  function saveToneDraft() {
    if (!toneDraft) return;
    var next = readToneFields();
    if (!next.key) { toast("Give the tone a name first."); return; }
    var list = palette();
    var clash = list.findIndex(function (entry) { return entry.key === next.key; });
    if (clash >= 0 && clash !== toneDraft.index) {
      toast('There is already a tone called "' + list[clash].label + '".');
      return;
    }
    if (toneDraft.index >= 0) list[toneDraft.index] = next;
    else if (list.length < MAX_TONES) list.push(next);
    savePalette(list);
    toneDraft = null;
    renderTheme();
    renderSlots();
    announce("Tone saved.");
  }

  function deleteToneDraft() {
    if (!toneDraft || toneDraft.index < 0) return;
    var list = palette();
    if (list.length <= 1) { toast("Keep at least one tone."); return; }
    list.splice(toneDraft.index, 1);
    savePalette(list);
    toneDraft = null;
    renderTheme();
    renderSlots();
    announce("Tone deleted.");
  }

  function restoreBuiltInTones() {
    var list = palette();
    var seen = Object.create(null);
    list.forEach(function (tone) { seen[tone.key] = true; });
    builtInProfiles().forEach(function (tone) {
      if (!seen[tone.key] && list.length < MAX_TONES) list.push(tone);
    });
    savePalette(list);
    renderTheme();
    renderSlots();
    announce("Built-in tones restored.");
  }

  function resetPanelPositions() {
    ui.panelX = null;
    ui.panelY = null;
    ui.pathsX = null;
    ui.pathsY = null;
    if (themeEl) {
      themeEl.classList.remove("is-pinned");
      themeEl.style.left = "";
      themeEl.style.top = "";
      themeEl.style.bottom = "";
    }
    if (bubbleEl) {
      bubbleEl.classList.remove("is-pinned");
      bubbleEl.style.left = "";
      bubbleEl.style.top = "";
      bubbleEl.style.bottom = "";
    }
    if (pathsEl) {
      pathsEl.classList.remove("is-pinned");
      pathsEl.style.left = "";
      pathsEl.style.top = "";
    }
    saveUi();
    positionPanels();
    if (pathsEl && pathsEl.open) placePathsDialog();
    renderTheme();
    announce("Popup positions reset.");
  }

  /* ---------- chat context ---------- */

  function messageArray(result) {
    if (Array.isArray(result)) return result;
    if (result && Array.isArray(result.messages)) return result.messages;
    if (result && Array.isArray(result.items)) return result.items;
    return [];
  }

  function messageText(message) {
    if (!message || typeof message !== "object") return "";
    var candidates = [message.content, message.mes, message.text, message.message];
    for (var i = 0; i < candidates.length; i += 1) {
      if (typeof candidates[i] === "string") return candidates[i];
      if (candidates[i] && typeof candidates[i].text === "string") return candidates[i].text;
      if (Array.isArray(candidates[i])) {
        var joined = candidates[i].map(function (part) {
          return typeof part === "string" ? part : (part && typeof part.text === "string" ? part.text : "");
        }).filter(Boolean).join("\n");
        if (joined) return joined;
      }
    }
    return "";
  }

  function messageRole(message) {
    var role = message && (message.role || message.author || message.sender);
    return typeof role === "string" ? role.toLowerCase() : "";
  }

  function isUserMessage(message) {
    var role = messageRole(message);
    if (role) return role === "user" || role === "human" || role === "persona";
    return message && (message.isUser === true || message.is_user === true);
  }

  function isHiddenMessage(message) {
    return !!(message && (
      message.hidden === true ||
      message.isHidden === true ||
      message.is_hidden === true ||
      message.isSystem === true ||
      message.is_system === true
    ));
  }

  function nameOf(value) {
    if (!value) return "";
    if (typeof value === "string") return value.trim();
    if (typeof value === "object") {
      var candidate = value.name || value.title || value.displayName;
      if (typeof candidate === "string") return candidate.trim();
    }
    return "";
  }

  // {{user}}/{{persona}}/{{charIfNotGroup}} are Tavo's card-and-lorebook prompt-template
  // macros - they expand while Tavo assembles its OWN main-reply request, not inside an
  // arbitrary string a plugin hands to tavo.generate(). Neither the plugin docs nor the
  // TavoJS docs describe generate() processing them, so treating them as the primary way
  // to name the player/character would risk the model seeing literal, unexplained "{{user}}"
  // tokens as the subject of every instruction. Resolving real names directly is the only
  // path that doesn't depend on that unconfirmed behavior.
  // Verified against live Tavo data: chat.persona is {id,name}, and the cast lives in
  // chat.characters as an ARRAY (there is no chat.character). A card can be a whole setting
  // holding several characters, so the cast is kept as a list rather than a single "other".
  async function identities(messages) {
    var chat = null;
    try { chat = await Promise.resolve(tavo.chat.current()); } catch (_) { chat = null; }

    var persona = nameOf(chat && (chat.persona || chat.personaName));
    var cast = [];
    if (chat && Array.isArray(chat.characters)) {
      cast = chat.characters.map(nameOf).filter(Boolean);
    }

    if (!persona) {
      for (var i = messages.length - 1; i >= 0; i -= 1) {
        if (isUserMessage(messages[i])) { persona = speakerFieldName(messages[i]); if (persona) break; }
      }
    }
    if (!cast.length) {
      for (var j = messages.length - 1; j >= 0; j -= 1) {
        if (!isUserMessage(messages[j])) {
          var found = speakerFieldName(messages[j]);
          if (found && cast.indexOf(found) < 0) cast.push(found);
        }
      }
    }

    // Without the cards the model only ever sees loose transcript and has to invent who
    // these people are. Fetching them is what lets an option sound like this character in
    // this world rather than a generic reply.
    var personaDescription = "";
    var cardNotes = [];
    try {
      var personaId = chat && (chat.personaId || (chat.persona && chat.persona.id));
      if (personaId != null && tavo.persona && typeof tavo.persona.get === "function") {
        personaDescription = descriptionOf(await Promise.resolve(tavo.persona.get(personaId)));
      }
    } catch (_) {}
    try {
      var charIds = chat && Array.isArray(chat.characterIds) ? chat.characterIds.slice(0, 2) : [];
      for (var k = 0; k < charIds.length; k += 1) {
        var card = await Promise.resolve(tavo.character.get(charIds[k]));
        var data = (card && card.data) ? card.data : card;
        var described = descriptionOf(data);
        if (described) cardNotes.push({ name: nameOf(data && data.name) || cast[k] || "Character", description: described });
      }
    } catch (_) {}

    return { persona: persona || "the player", cast: cast, personaDescription: personaDescription, cardNotes: cardNotes };
  }

  function descriptionOf(obj) {
    if (!obj || typeof obj !== "object") return "";
    var described = obj.description || (obj.data && obj.data.description);
    return typeof described === "string" ? described.trim() : "";
  }

  // message.name in Tavo is a message label such as "#0", never the speaker. The real
  // speaker is message.speakerName; reading .name here put "#0:" in front of every
  // transcript line and destroyed the model's sense of who was talking.
  function speakerFieldName(message) {
    return nameOf(message.speakerName) || nameOf(message.characterName) || nameOf(message.speaker);
  }

  function speakerName(message, ids) {
    if (isUserMessage(message)) return speakerFieldName(message) || ids.persona;
    return speakerFieldName(message) || (ids.cast.length ? ids.cast[0] : "Narrator");
  }

  // Image payloads are presentation/attachment data, not roleplay prose. Strip the common
  // forms before a message is allowed to count toward the scene window; doing this only
  // while assembling the transcript lets an image-only final reply evict the last readable
  // character response and leaves the model with an apparently empty scene.
  function cleanForPrompt(text) {
    return String(text || "")
      .replace(/<picture\b[^>]*>[\s\S]*?<\/picture>/gi, "")
      .replace(/<img\b[^>]*\/?>/gi, "")
      .replace(/!\[[^\]]*\]\(\s*(?:<[^>]*>|(?:\\.|[^)])*)\s*\)/g, "")
      .replace(/!\[[^\]]*\]\s*\[[^\]]*\]/g, "")
      .replace(/^[ \t]*\[[^\]]+\]:[ \t]*(?:<?data:image\/[^\s>]+>?|<?[^\s>]+\.(?:avif|bmp|gif|jpe?g|png|svg|webp)(?:[?#][^\s>]*)?>?)(?:[ \t]+["'(][^\n]*["')])?[ \t]*$/gim, "")
      .replace(/^[ \t]*<?(?:https?:\/\/|file:\/\/\/|blob:|\/)?[^\s<>]+\.(?:avif|bmp|gif|jpe?g|png|svg|webp)(?:[?#][^\s<>]*)?>?[ \t]*$/gim, "")
      .replace(/^[ \t]*data:image\/[^\s,]+,[^\s]+[ \t]*$/gim, "")
      .replace(/data:image\/[a-z0-9.+-]+;base64,[a-z0-9+/=]+/gi, "")
      .replace(/^[ \t]*\[(?:image|img|photo|picture)(?:[ \t]*:[^\]]*)?\][ \t]*$/gim, "")
      .replace(/\r/g, "")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  // A roleplay message ends on the beat the player must answer - the question asked, the
  // door closing, the hand extended. Cutting from the front destroys exactly that, so an
  // over-long message keeps its opening and its ending and elides the middle instead.
  function trimMessage(text, limit) {
    var value = String(text || "");
    if (value.length <= limit) return value;
    var head = Math.floor(limit * 0.3);
    var tail = limit - head - 24;
    return value.slice(0, head).trimEnd() + "\n[...]\n" + value.slice(value.length - tail).trimStart();
  }

  function transcriptTail(text, limit) {
    var value = String(text || "");
    var maximum = Math.max(0, Math.floor(Number(limit) || 0));
    if (value.length <= maximum) return value;
    if (maximum === 0) return "";
    var marker = "…\n\n";
    if (maximum <= marker.length) return marker.slice(0, maximum);
    var start = value.length - (maximum - marker.length);
    // Prefer a speaker boundary near the calculated cut so the retained context starts with
    // a complete [PLAYER]/[CHARACTER] tag instead of the middle of a sentence.
    var boundary = value.indexOf("\n\n[", start);
    if (boundary >= 0 && boundary - start < Math.min(800, Math.floor(maximum / 3))) {
      start = boundary + 2;
    }
    return marker + value.slice(start);
  }

  // Context is bounded by AI responses rather than raw message count, so a stretch of short
  // back-and-forth still reaches back the same distance in the story. Player turns that fall
  // inside that span come along, which keeps the exchange readable.
  async function recentMessages() {
    var raw;
    try { raw = await tavo.message.find(); } catch (_) { raw = null; }
    var all = messageArray(raw).filter(function (m) {
      return !isHiddenMessage(m) && !!cleanForPrompt(messageText(m));
    });
    if (allContextEnabled()) return all;
    var characterPositions = [];
    for (var i = 0; i < all.length; i += 1) {
      if (!isUserMessage(all[i])) characterPositions.push(i);
    }
    var windowSize = responseWindow();
    if (characterPositions.length <= windowSize) return all;
    return all.slice(characterPositions[characterPositions.length - windowSize]);
  }

  /* ---------- prompt ---------- */

  function lengthGuidance(targetWords) {
    var target = Math.round(Number(targetWords) || 0);
    if (target > 0) {
      var tolerance = Math.max(8, Math.round(target * 0.12));
      var minimum = Math.max(12, target - tolerance);
      var maximum = target + tolerance;
      return "Keep this replacement about the same length as the option it replaces: " +
        minimum + " to " + maximum + " words, aiming for roughly " + target +
        ". Do not shrink it back to the default choice length.";
    }
    return "Each option is 25 to 60 words.";
  }

  function languageLine() {
    var language = String(cfg("storyLanguage", "") || "").trim();
    if (!language || /^(english|auto|default)$/i.test(language)) return "";
    return 'Write every "label" and "text" value in ' + language + ". Keep the JSON keys and tone values in English.";
  }

  var CUSTOM_FENCE_OPEN = "<<<CUSTOM INSTRUCTION>>>";
  var CUSTOM_FENCE_CLOSE = "<<<END CUSTOM INSTRUCTION>>>";

  function customInstruction() {
    if (!barSettings || typeof barSettings !== "object") loadBarSettings();
    var custom = String(barSettings.systemPrompt || "").trim();
    // v1.2.0 stored the old built-in prompt as the field default. Treat that exact legacy
    // value as "use the built-in" so upgrades gain replacement semantics without requiring
    // every existing user to clear the field manually.
    var legacyDefault = "Suggest what the player character could do or say next. Every option must be a genuinely different direction for the scene, not the same move reworded. Stay inside the established genre, tone, and continuity. Never narrate or speak for anyone except the player character.";
    if (custom === legacyDefault) return "";
    return cap(custom.split(CUSTOM_FENCE_OPEN).join("")
      .split(CUSTOM_FENCE_CLOSE).join("").trim(), MAX_CUSTOM_INSTRUCTION_CHARS);
  }

  function instruction(custom) {
    if (!custom) {
      return "Suggest what the player character could do or say next. Every option must be a genuinely different direction for the scene, not the same move reworded. Stay inside the established genre, tone, and continuity.";
    }
    return "The creative brief is the CUSTOM CHOICE INSTRUCTION printed below the scene, immediately before the final request. It replaces Crossroads' built-in style, subject, voice, formatting, and length defaults. The remaining rules define only whose turn is written, what the player can know, the option count, the tone vocabulary, and JSON format.";
  }

  function instructionBlock(custom) {
    return [
      "CUSTOM CHOICE INSTRUCTION — authoritative for creative content:",
      CUSTOM_FENCE_OPEN,
      custom,
      CUSTOM_FENCE_CLOSE,
      "Every listed requirement applies to every option. If requirements conflict, obey the more specific one while respecting the rest. This instruction controls creative style; only the player-only, continuity, count, tone, and JSON rules remain invariant."
    ].join("\n");
  }

  // The Choice instruction setting is free text a user can edit, and Tavo-adjacent apps
  // commonly use {{user}}/{{persona}}/{{char}}-style macros elsewhere, so someone typing
  // one here would reasonably expect it to resolve. tavo.generate() does not expand these
  // itself (see identities() above), so this substitution is what actually makes it work,
  // independent of whether the platform ever adds real expansion for plugin prompts.
  function substituteMacros(text, ids) {
    return String(text || "")
      .replace(/\{\{\s*user\s*\}\}/gi, ids.persona)
      .replace(/\{\{\s*persona\s*\}\}/gi, ids.persona)
      .replace(/\{\{\s*char(?:IfNotGroup)?\s*\}\}/gi, ids.cast.length ? ids.cast[0] : "the character");
  }

  // `avoid` carries the options the player is keeping, so a single-slot redraw returns
  // something genuinely new instead of a paraphrase of what is already on the bar.
  function buildPrompt(messages, count, avoid, ids, targetWords) {
    var player = ids.persona;
    var playerHasWritten = messages.some(isUserMessage);
    var planning = cfgEnabled("planningStep", true);
    var custom = customInstruction();
    // Rotate a small prompt-facing subset rather than always listing the built-ins first.
    // This keeps a large/custom palette genuinely reachable without spending tokens on all
    // twenty-four definitions every draw.
    var tones = toneShortlist(count);
    var allContext = allContextEnabled();
    var referenceRule = custom
      ? "Two blocks follow. CHARACTER REFERENCE is background for identity, personality, and world continuity. CURRENT SCENE is what is actually happening right now. Use both for factual consistency, while the CUSTOM CHOICE INSTRUCTION controls creative style and voice."
      : "Two blocks follow. CHARACTER REFERENCE is background: who these people are, how they speak, and the world they live in. CURRENT SCENE is what is actually happening right now. Use the reference for voice and consistency, but your options must continue the CURRENT SCENE.";

    // Explicit role tags remove any ambiguity about which speaker is the human player.
    var transcript = messages.map(function (m) {
      var mine = isUserMessage(m);
      var cleaned = cleanForPrompt(messageText(m));
      return (mine ? "[PLAYER] " : "[CHARACTER] ") + speakerName(m, ids) + ": " +
        (allContext ? cleaned : trimMessage(cleaned, MAX_MESSAGE_CHARS));
    }).join("\n\n");

    var avoidBlock = "";
    if (Array.isArray(avoid) && avoid.length) {
      avoidBlock = "The player is already holding these directions and is keeping them. Your option must differ from every one of them in intent, not merely in wording:\n" +
        avoid.map(function (option, index) {
          return (index + 1) + ". [" + toneLabel(option.tone) + "] " + option.label + " — " + cap(option.text, 240);
        }).join("\n");
    }

    var head = [
      "[OOC: You are Crossroads, a choice generator attached to a roleplay chat.",
      // Stated before the user's own instruction so the side of the scene being written is
      // never ambiguous, and cannot be edited away by accident in plugin settings.
      "You write ONLY the next turn for " + player + ", the human player's own character.",
      // A card can be a whole setting whose cast is introduced in the prose rather than in
      // chat.characters, so this is framed as "everyone who is not the player" instead of
      // naming a single opponent that may not exist.
      "Every other character in the scene belongs to the model, including any introduced in the story so far and any not named here. Never write, imply, or narrate their words, actions, thoughts, or reactions in any option.",
      "Each option is one turn taken by " + player + " and stops there. Do not continue the scene past it, do not resolve how anyone else responds, and do not address the reader.",
      referenceRule,
      "Every option must follow directly from the FINAL line of the CURRENT SCENE. If a question was just asked of " + player + ", the options are answers to it. If something was just done to " + player + ", the options are reactions to it.",
      // Roleplay prose freely mixes omniscient narration and private interior monologue.
      // The model can see a character's secret; the player character cannot, and options
      // that react to an unshared secret read as nonsense.
      "The scene mixes narration with other characters' private thoughts, often in *italics*, and the reference may describe secrets too. " + player + " knows none of it. Never write an option in which " + player + " reacts to, references, or guesses information they were never actually told or shown aloud.",
      instruction(custom)
    ];
    // A custom instruction replaces creative defaults instead of fighting them.
    if (!custom) head.push(lengthGuidance(targetWords));
    var language = languageLine();
    if (language) head.push(language);
    head.push("Return ONLY a valid JSON object. No commentary, no markdown fences.");
    var exampleTone = JSON.stringify(tones[0].label);
    if (planning) {
      var defaultPlanExamples = ["accept openly", "deflect with humor", "push back", "change the subject", "ask a question", "take action", "wait cautiously", "reveal a concern"];
      var planExample = [];
      for (var planIndex = 0; planIndex < count; planIndex += 1) {
        planExample.push(custom ? "check custom instruction " + (planIndex + 1) : defaultPlanExamples[planIndex]);
      }
      head.push('Shape: {"plan":' + JSON.stringify(planExample) + ',"options":[{"tone":' + exampleTone + ',"label":"three to five word summary","text":"what ' + player + ' does or says"}]}');
      head.push(custom
        ? 'Fill "plan" FIRST with exactly ' + count + ' short plain phrases, one per option, checking how each will follow the CUSTOM CHOICE INSTRUCTION. Do not put quotation marks inside a phrase. Then write "options". The plan is discarded.'
        : 'Fill "plan" FIRST with exactly ' + count + ' short plain phrases, one per option, naming its distinct tactic so no two collapse into the same move. Do not put quotation marks inside a phrase. Then write "options". The plan is discarded.');
    } else {
      head.push('Shape: {"options":[{"tone":' + exampleTone + ',"label":"three to five word summary","text":"what ' + player + ' does or says"}]}');
    }
    head.push(count === 1
      ? "Return exactly 1 option, as a single entry in the options array."
      : "Return exactly " + count + " options" + (custom ? "." : ", ordered from most direct to most unexpected."));
    head.push('The "tone" value must come from the TONE PALETTE printed below the scene.');
    if (custom) {
      head.push('Write each "text" as ' + player + "'s own turn. Let the CUSTOM CHOICE INSTRUCTION control its voice, tense, formatting, subject, style, and length.");
    } else {
      head.push(playerHasWritten
        ? 'Write each "text" as ' + player + "'s own turn, matching the voice, tense, and formatting the player has already been using."
        : 'The player has not written a turn yet, so there is no sample of their voice. Write each "text" as ' + player + "'s own turn in a natural, simple voice. Do not imitate the narration style of the scene text, and do not open by describing the other characters.");
    }
    head.push("]");

    // Each block says what it is for. Without that the card reads as if it were happening
    // now, and the model answers the character's backstory instead of the live scene.
    var castBlock = "";
    var castLines = [];
    if (ids.personaDescription) {
      castLines.push(player + " (the player's character - you write only for this one): " + cap(cleanForPrompt(ids.personaDescription), MAX_CARD_CHARS));
    }
    (ids.cardNotes || []).forEach(function (note) {
      castLines.push(note.name + " (belongs to the model - never write for them): " + cap(cleanForPrompt(note.description), MAX_CARD_CHARS));
    });
    if (castLines.length) {
      castBlock = "CHARACTER REFERENCE - background only, for identity, personality and world consistency. This is NOT the current situation and may describe things " +
        player + " has never learned:\n" + castLines.join("\n\n");
    }

    var fallbackChat = custom
      ? "No readable messages yet."
      : "No readable messages yet. Offer opening moves that fit a brand new scene.";
    var contextDescription = allContext
      ? "all visible messages in the chat"
      : "the last " + responseWindow() + " responses and the live situation";
    var playerLineGuidance = custom
      ? "Lines tagged [PLAYER] were written by the human player as " + player + ". They are scene context; use the CUSTOM CHOICE INSTRUCTION, not a built-in imitation rule, to decide voice, tense, vocabulary, length, and formatting. "
      : "Lines tagged [PLAYER] were written by the human player as " + player + " — study their voice, tense, vocabulary, length, and formatting, because your options must read as if that same person wrote them. ";
    var chatHeader = "CURRENT SCENE - " + contextDescription + ". This is what your options must continue. " +
      playerLineGuidance +
      "Lines tagged [CHARACTER] belong to the model; never write those:\n";
    var closer = "Now write " + (count === 1 ? "the option" : "the " + count + " options") + " as " + player +
      "'s very next turn, continuing directly from the final line of the CURRENT SCENE above." +
      (custom ? " Every option must satisfy every requirement of the custom instruction directly above." : "");
    var sections = [head.join("\n")];
    if (castBlock) sections.push(castBlock);
    if (avoidBlock) sections.push(avoidBlock);
    var transcriptSectionIndex = sections.push(chatHeader + (transcript || fallbackChat)) - 1;
    if (custom) sections.push(instructionBlock(custom));
    sections.push(tonePaletteBlock(tones, count, custom));
    sections.push(closer);

    var prompt = substituteMacros(sections.join("\n\n"), ids);
    if (!allContext && prompt.length > MAX_PROMPT_CHARS && transcript) {
      var fixedSections = sections.slice();
      fixedSections[transcriptSectionIndex] = chatHeader;
      var fixedPrompt = substituteMacros(fixedSections.join("\n\n"), ids);
      var allowance = Math.max(0, MAX_PROMPT_CHARS - fixedPrompt.length);
      sections[transcriptSectionIndex] = chatHeader + transcriptTail(transcript, allowance);
      prompt = substituteMacros(sections.join("\n\n"), ids);
      // Macro expansion inside old messages can make the first estimate slightly large.
      for (var trimPass = 0; trimPass < 4 && prompt.length > MAX_PROMPT_CHARS; trimPass += 1) {
        allowance = Math.max(0, allowance - (prompt.length - MAX_PROMPT_CHARS) - 8);
        sections[transcriptSectionIndex] = chatHeader + transcriptTail(transcript, allowance);
        prompt = substituteMacros(sections.join("\n\n"), ids);
      }
    }

        MAX_PROMPT_CHARS.toLocaleString() +

    return prompt;
  }

  function generationText(result) {
    if (typeof result === "string") return result;
    if (!result || typeof result !== "object") return "";

      var dataText = generationText(result.data);
      if (dataText) return dataText;
    }
    var candidates = [result.text, result.content, result.message, result.output, result.response];
    for (var i = 0; i < candidates.length; i += 1) {
      if (typeof candidates[i] === "string" && candidates[i].trim()) return candidates[i];
      if (candidates[i] && typeof candidates[i] === "object") {
        var nested = openAIContentText(candidates[i]) ||
          openAIContentText(candidates[i].content) ||
          openAIContentText(candidates[i].text);
        if (nested) return nested;
      }
    }
    var choice = Array.isArray(result.choices) ? result.choices[0] : null;
    if (choice && choice.message) {
      var choiceText = openAIContentText(choice.message.content) ||
        openAIContentText(choice.message.reasoning) ||
        openAIContentText(choice.message.reasoning_content) ||
        openAIContentText(choice.message.reasoning_details);

    }
    return openAIResponseText(result);
  }
